# Release: on a v* tag, build FeatherBench.exe on Windows and publish a GitHub Release.
# Part of nn-playground (AGPL-3.0; see COMMERCIAL.md).
#
# Tags are pushed by maintainers only. Two jobs, like the leaderboard workflow:
# "build" (read-only token) runs the tests, freezes the app with PyInstaller, smoke-tests
# the .exe (trains, and runs console cells in worker processes) and zips it; "publish"
# never runs repo code, it only attaches the zip, its SHA-256 and the notes to a release.
# Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pyqtgraph PyQt6 "pyinstaller==6.22.3"

      - name: Tag matches the code's version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v="$(python -c 'import nncore; print(nncore.__version__)')"
          if [ "v$v" != "$TAG" ]; then echo "::error::tag $TAG but nncore.__version__ is $v"; exit 1; fi

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -t .

      - name: Build and smoke-test FeatherBench.exe
        env:
          QT_QPA_PLATFORM: offscreen
        run: python packaging/build_windows.py --smoke

      - name: Checksum and release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          PYTHONIOENCODING: utf-8  # the notes contain → ≤ ×; Windows' default cp1252 stdout can't
        run: |
          cd dist
          zip="FeatherBench-${TAG}-windows-x64.zip"
          sha256sum "$zip" > "$zip.sha256"
          ver="${TAG#v}"
          python - "$ver" > notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          log = open("../CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(ver)}\b.*?$(.*?)(?=^## |\Z)", log, re.M | re.S)
          body = m.group(1).strip() if m else "See CHANGELOG.md."
          print("**Windows:** download `FeatherBench-v%s-windows-x64.zip`, unzip, run `FeatherBench.exe`. "
                "No Python needed. The build isn't code-signed, so SmartScreen may ask: More info > Run anyway "
                "(compare the SHA-256 below first).\n\n"
                "**From source / AI agents:** `git clone https://github.com/tactical-drone/FeatherBench`, "
                "`pip install -r requirements.txt`, see README.md and AGENTS.md.\n\n%s" % (ver, body))
          PY
          printf '\n\nSHA-256: `%s`\n' "$(cut -d' ' -f1 "$zip.sha256")" >> notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: |
            dist/FeatherBench-*-windows-x64.zip
            dist/FeatherBench-*-windows-x64.zip.sha256
            dist/notes.md
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          DIR: ${{ runner.temp }}/release
        run: |
          set -eu
          gh release create "$TAG" --repo "$REPO" --title "FeatherBench $TAG" --notes-file "$DIR/notes.md" \
            "$DIR/FeatherBench-${TAG}-windows-x64.zip" "$DIR/FeatherBench-${TAG}-windows-x64.zip.sha256"
