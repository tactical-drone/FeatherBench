# FeatherBench leaderboard. Part of nn-playground (AGPL-3.0; see COMMERCIAL.md).
#
# Runs only on main, after a maintainer merged a submission (or by hand), so it only ever
# executes reviewed code. It scores the changed submissions itself on this Linux runner,
# keeps one result per racer in featherbench/results/, and rebuilds
# featherbench/leaderboard.json, which the UI's FeatherBench > Top 10 reads.
name: FeatherBench leaderboard

on:
  push:
    branches: [main]
    paths:
      - "featherbench/submissions/**"
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Score every submission again (e.g. after a code change)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: featherbench-leaderboard
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install (CPU torch, no UI packages)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      - name: Score submissions
        env:
          BEFORE: ${{ github.event.before }}
          RESCORE_ALL: ${{ inputs.rescore_all }}
        run: |
          mkdir -p featherbench/results
          if [ "$RESCORE_ALL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files="$(ls featherbench/submissions/*.json 2>/dev/null || true)"
          else
            files="$(git diff --name-only "$BEFORE" HEAD -- featherbench/submissions/)"
          fi
          for f in $files; do
            user="$(basename "$f" .json)"
            if [ -f "$f" ]; then
              echo "scoring $f"
              python -m rsi featherbench verify "$f" --workers 4 --result-out "featherbench/results/${user}.json" \
                > /dev/null || echo "::warning::$f did not verify; it stays off the leaderboard"
            else
              rm -f "featherbench/results/${user}.json"  # the submission was removed
            fi
          done
          python -m rsi featherbench leaderboard > /dev/null

      - name: Commit the leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add featherbench/results featherbench/leaderboard.json
          if git diff --cached --quiet; then
            echo "leaderboard unchanged"
          else
            git commit -m "FeatherBench: update leaderboard"
            git push
          fi
