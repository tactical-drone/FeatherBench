# FeatherBench leaderboard. Part of nn-playground (AGPL-3.0; see COMMERCIAL.md).
#
# Runs only on main, after a maintainer merged a submission (or by hand), so it only ever
# executes reviewed code. It scores the changed submissions itself on this Linux runner,
# keeps one result per racer in featherbench/results/, and rebuilds
# featherbench/leaderboard.json, which the UI's FeatherBench > Top 10 reads.
#
# Two jobs: "score" runs the benchmark with a read-only token and no stored credentials;
# "publish" never runs repo code, it only copies the scored JSON files and commits them.
# Actions are pinned to commit SHAs.
name: FeatherBench leaderboard

on:
  push:
    branches: [main]
    paths:
      - "featherbench/submissions/**"
  workflow_dispatch:
    inputs:
      rescore_all:
        description: "Score every submission again (e.g. after a code change)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: featherbench-leaderboard
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install (CPU torch, no UI packages)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy

      - name: Score submissions
        env:
          # Secret held-out seeds (comma-separated ints). Only this job, on reviewed code from main,
          # can read it; results publish aggregates only, and the held-out run logs nothing.
          FEATHERBENCH_HOLDOUT_SEEDS: ${{ secrets.FEATHERBENCH_HOLDOUT_SEEDS }}
          BEFORE: ${{ github.event.before }}
          RESCORE_ALL: ${{ inputs.rescore_all }}
        run: |
          mkdir -p featherbench/results
          if [ "$RESCORE_ALL" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            files="$(ls featherbench/submissions/*.json 2>/dev/null || true)"
          else
            files="$(git diff --name-only "$BEFORE" HEAD -- featherbench/submissions/)"
          fi
          for f in $files; do
            user="$(basename "$f" .json)"
            if [ -f "$f" ]; then
              echo "scoring $f"
              python -m rsi featherbench verify "$f" --workers 4 --result-out "featherbench/results/${user}.json" \
                > /dev/null || echo "::warning::$f did not verify; it stays off the leaderboard"
            else
              rm -f "featherbench/results/${user}.json"  # the submission was removed
            fi
          done
          python -m rsi featherbench leaderboard > /dev/null

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: featherbench-scores
          path: |
            featherbench/results/
            featherbench/leaderboard.json
          retention-days: 7

  publish:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: featherbench-scores
          path: ${{ runner.temp }}/scores

      - name: Copy the scored JSON (nothing else) and commit
        env:
          SCORES: ${{ runner.temp }}/scores
        run: |
          set -eu
          test -f "$SCORES/leaderboard.json"
          rm -rf featherbench/results && mkdir -p featherbench/results
          find "$SCORES/results" -maxdepth 1 -type f -name '*.json' -exec cp {} featherbench/results/ \;
          cp "$SCORES/leaderboard.json" featherbench/leaderboard.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A featherbench/results featherbench/leaderboard.json
          if git diff --cached --quiet; then
            echo "leaderboard unchanged"
            exit 0
          fi
          git commit -m "FeatherBench: update leaderboard"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
